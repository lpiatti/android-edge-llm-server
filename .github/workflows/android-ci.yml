name: Android CI and Bootstrap Verification

on:
  push:
    branches:
      - main
      - feature/android-skeleton
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Verify the repository rules and bootstrap structure are maintained
  bootstrap-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Mandatory Bootstrap & Rules Files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "docs/index.md"
            "docs/project-state.md"
            "docs/roadmap.md"
            "docs/architecture.md"
            "AGENTS.md"
            ".agents/README.md"
            ".agents/bootstrap-phase-0.md"
            ".agents/create-android-skeleton.md"
            "CLAUDE.md"
            ".claude/README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required repository structure file: $file"
              exit 1
            fi
          done

          echo "All required bootstrap and policy documentation files verified."

  # Job 2: Compile the Android project and package the APK using Java 17 and Gradle 8.4
  android-build:
    needs: bootstrap-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-overwrite-existing: true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        # We run the Gradle Wrapper to ensure build reproducibility and local plugin version mapping
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-llm-server-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
