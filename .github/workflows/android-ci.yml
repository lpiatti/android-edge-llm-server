name: Android CI and Bootstrap Verification

on:
  push:
    branches:
      - main
      - feature/android-skeleton
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: Verify the repository rules and bootstrap structure are maintained
  bootstrap-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Mandatory Bootstrap & Rules Files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "STATE.md"
            "DECISIONI.md"
            "docs/index.md"
            "docs/roadmap.md"
            "docs/api-contract.md"
            "docs/architecture.md"
            "AGENTS.md"
            ".agents/README.md"
            "CLAUDE.md"
            ".claude/README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required repository structure file: $file"
              exit 1
            fi
          done

          echo "All required bootstrap and policy documentation files verified."

  # Job 2: Compile the Android project and package the APK using Java 17 and Gradle 8.4
  android-build:
    needs: bootstrap-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-overwrite-existing: true

      - name: Run Unit Tests and Build Debug APK
        # Run unit tests before building the debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-llm-server-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # Job 3: Publish the APK (not zipped) as a rolling pre-release with a stable, public link:
  # https://github.com/<owner>/<repo>/releases/download/dev-latest/edge-llm-server-debug.apk
  # CI artifacts are always zipped and need a GitHub login, which is impractical on the phone.
  publish-dev-apk:
    needs: android-build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-llm-server-debug-apk

      - name: Replace dev-latest Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          mv app-debug.apk edge-llm-server-debug.apk
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest edge-llm-server-debug.apk \
            --prerelease \
            --target "$TARGET_SHA" \
            --title "Dev build (latest CI)" \
            --notes "Debug APK built by CI from \`$SOURCE_REF\` at commit $TARGET_SHA. Overwritten on every build: not a release."
