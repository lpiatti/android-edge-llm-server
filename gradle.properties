# Gradle and Android Project Configuration
# ----------------------------------------
# This file contains local settings for Gradle builds.
# It is committed to git to ensure the CI pipeline compiles with identical settings.

# Enforce the use of AndroidX (the modern, supported set of Android libraries)
android.useAndroidX=true

# Keep the R class definitions namespace-isolated for improved compilation times
android.nonTransitiveRClass=true

# Use official Kotlin code formatting style
kotlin.code.style=official

# Limit Gradle JVM memory to 2GB to prevent out-of-memory errors in resource-constrained environments (like CI/CD pipelines)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
